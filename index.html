<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>A Arca do Noé</title>
  <meta name="description" content="Cada novo seguidor vira um ajudante do Noé. Venha ver a arca sendo construída dia após dia, e entre na obra!">
  <link rel="stylesheet" href="css/estilo.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <canvas id="cena"></canvas>

  <!-- Site: painel discreto no canto -->
  <section id="painel" class="so-site">
    <button id="painel-topo" type="button" aria-expanded="true" aria-controls="painel-corpo">
      <span class="painel-titulo">🛶 A Arca do Noé</span>
      <span class="painel-dia" id="painel-dia">Dia 1</span>
      <span class="painel-seta" aria-hidden="true">▾</span>
    </button>
    <div id="painel-corpo">
      <div class="painel-linha"><b id="painel-ajudantes">0</b> <span id="painel-ajudantes-rotulo">ajudantes</span> <span id="painel-ganho" class="painel-ganho" hidden></span></div>
      <div class="mini-barra" role="progressbar" aria-label="Progresso da arca"><div id="painel-barra"></div></div>
      <div class="painel-proxima" id="painel-proxima"></div>
      <div class="painel-animais" id="painel-animais"></div>
    </div>
  </section>

  <a id="seguir" class="so-site" href="https://www.instagram.com/arca_do_noee/" target="_blank" rel="noopener">
    <img src="assets/perfil.jpg" alt=""> <span>Seguir <b id="seguir-perfil">@arca_do_noee</b></span>
  </a>

  <button id="explorar" class="so-site" type="button">🎮 Explorar a obra</button>

  <!-- Modo exploração -->
  <div id="joystick" hidden><div class="base"><div class="pino"></div></div></div>
  <button id="sair" type="button" hidden>✕ Sair</button>
  <div id="dica" hidden>Ande com o joystick (ou WASD) · arraste a tela para olhar · Shift corre</div>
  <div id="aviso" hidden></div>
  <div id="balao" hidden></div>

  <!-- Modo vídeo (?video=1): HUD grande para Reels -->
  <div id="hud" class="so-video">
    <header>
      <div class="titulo">A ARCA DO NOÉ</div>
      <div class="dia" id="hud-dia">Dia 1</div>
      <div><div id="ganho" class="ganho" hidden></div></div>
    </header>

    <footer>
      <div class="ajudantes"><span id="hud-ajudantes">0</span> <small id="hud-ajudantes-rotulo">ajudantes</small></div>
      <div class="barra"><div class="barra-preenchida" id="hud-barra"></div></div>
      <div class="barra-legenda"><span>Arca</span><span id="hud-porcentagem">0%</span></div>
      <div class="proxima" id="hud-proxima"></div>
      <div class="animais" id="hud-animais"></div>
      <div class="cta">Siga <b id="hud-perfil">@arca_do_noee</b>: vire ajudante e garanta sua vaga na arca 🎟️</div>
    </footer>
  </div>

  <div id="carregando">Chamando o Noé…</div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
